plugins {
    id 'com.android.application'
}

def baseServerUrl = project.hasProperty('BASE_URL') ? project.property('BASE_URL').toString().replaceAll('/+$', '') : 'https://unifood.store'

android {
    namespace 'com.unifood.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
        buildConfigField "String", "BASE_URL", "\"${baseServerUrl}\""
        buildConfigField "String", "REMOTE_CONFIG_URL", "\"https://raw.githubusercontent.com/kareemsobhyali/Collage_project/main/app-config.json\""
        buildConfigField "String", "REMOTE_CONFIG_API_URL", "\"https://api.github.com/repos/kareemsobhyali/Collage_project/contents/app-config.json?ref=main\""
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        cruncherEnabled = false
    }

    def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: "release.keystore"
    def keystore = file(keystoreFilePath)
    def hasKeystore = keystore.exists()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile keystore
                storePassword (System.getenv("KEYSTORE_PASSWORD") ?: "unifood123")
                keyAlias (System.getenv("KEY_ALIAS") ?: "unifood")
                keyPassword (System.getenv("KEY_PASSWORD") ?: "unifood123")
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions = ["role"]

    productFlavors {
        student {
            dimension "role"
            applicationId "com.unifood.student"
            resValue "string", "app_name", "UniFood | يونيفود"
            buildConfigField "String", "START_URL", "\"${baseServerUrl}/\""
            buildConfigField "String", "FLAVOR_PATH", "\"/\""
            buildConfigField "String", "FLAVOR_TYPE", "\"student\""
            buildConfigField "boolean", "KEEP_SCREEN_ON", "false"
            buildConfigField "int", "STATUS_BAR_COLOR", "0xFF4F46E5"
        }
        driver {
            dimension "role"
            applicationId "com.unifood.driver"
            resValue "string", "app_name", "UniFood Driver | كابتن التوصيل"
            buildConfigField "String", "START_URL", "\"${baseServerUrl}/driver\""
            buildConfigField "String", "FLAVOR_PATH", "\"/driver\""
            buildConfigField "String", "FLAVOR_TYPE", "\"driver\""
            buildConfigField "boolean", "KEEP_SCREEN_ON", "true"
            buildConfigField "int", "STATUS_BAR_COLOR", "0xFF1E1B4B"
        }
        admin {
            dimension "role"
            applicationId "com.unifood.admin"
            resValue "string", "app_name", "UniFood Admin | إدارة يونيفود"
            buildConfigField "String", "START_URL", "\"${baseServerUrl}/admin\""
            buildConfigField "String", "FLAVOR_PATH", "\"/admin\""
            buildConfigField "String", "FLAVOR_TYPE", "\"admin\""
            buildConfigField "boolean", "KEEP_SCREEN_ON", "false"
            buildConfigField "int", "STATUS_BAR_COLOR", "0xFF0F172A"
        }
        restaurant {
            dimension "role"
            applicationId "com.unifood.restaurant"
            resValue "string", "app_name", "UniFood Restaurant | كاشير ومطبخ المطعم"
            buildConfigField "String", "START_URL", "\"${baseServerUrl}/branch/\""
            buildConfigField "String", "FLAVOR_PATH", "\"/branch/\""
            buildConfigField "String", "FLAVOR_TYPE", "\"restaurant\""
            buildConfigField "boolean", "KEEP_SCREEN_ON", "true"
            buildConfigField "int", "STATUS_BAR_COLOR", "0xFF065F46"
        }
        smsGateway {
            dimension "role"
            applicationId "com.unifood.smsgateway"
            resValue "string", "app_name", "UniFood SMS Gateway | بوابة الرسائل"
            buildConfigField "String", "START_URL", "\"${baseServerUrl}/sms-gateway-client\""
            buildConfigField "String", "FLAVOR_PATH", "\"/sms-gateway-client\""
            buildConfigField "String", "FLAVOR_TYPE", "\"smsGateway\""
            buildConfigField "boolean", "KEEP_SCREEN_ON", "true"
            buildConfigField "int", "STATUS_BAR_COLOR", "0xFF0369A1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK for minimal APK size (~1.5MB) and fast builds
}
