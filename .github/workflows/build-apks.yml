name: Build Android APKs (Student, Driver & Admin)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: 'رابط المنصة على Render'
        required: false
        default: 'https://collage-project-5zby.onrender.com'

permissions:
  contents: write

jobs:
  build-apks:
    name: توليد نسخ APK للطلاب والطيارين والإدارة
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare App Icon & Persistent Signing Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          cp -f customer-app/public/logo.png android-app/app/src/main/res/drawable/ic_launcher.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android-app/app/src/main/res/$dir"
            cp -f customer-app/public/logo.png "android-app/app/src/main/res/$dir/ic_launcher.png"
          done

          # محاولة استرجاع شهادة التوقيع الثابتة من الإصدار السابق حتى يظل توقيع المطور ثابتاً لدى Google Play Protect
          gh release download latest-apk -p "release.keystore" -D android-app/app --clobber || true

          if [ ! -f android-app/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-app/app/release.keystore \
              -alias unifood \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass unifood123 \
              -keypass unifood123 \
              -dname "CN=UniFood, OU=Campus, O=UniFood, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Build Signed Student, Driver & Admin APKs
        working-directory: android-app
        run: |
          SERVER_URL="${{ github.event.inputs.base_url || 'https://collage-project-5zby.onrender.com' }}"
          gradle assembleRelease -PBASE_URL="$SERVER_URL" --no-daemon

      - name: Collect Built APKs
        run: |
          STUDENT_APK=$(find android-app/app/build/outputs/apk/student/release -name "*.apk" | head -n 1)
          DRIVER_APK=$(find android-app/app/build/outputs/apk/driver/release -name "*.apk" | head -n 1)
          ADMIN_APK=$(find android-app/app/build/outputs/apk/admin/release -name "*.apk" | head -n 1)
          cp "$STUDENT_APK" ./UniFood-Student.apk
          cp "$DRIVER_APK" ./UniFood-Driver.apk
          cp "$ADMIN_APK" ./UniFood-Admin.apk
          ls -lh ./UniFood-Student.apk ./UniFood-Driver.apk ./UniFood-Admin.apk

      - name: Upload Student APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Student-APK
          path: ./UniFood-Student.apk
          if-no-files-found: error

      - name: Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Driver-APK
          path: ./UniFood-Driver.apk
          if-no-files-found: error

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Admin-APK
          path: ./UniFood-Admin.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "📲 تطبيقات UniFood للأندرويد (الطلاب + الطيارين + الإدارة)"
          body: |
            ### 🎓 تطبيقات منصة يونيفود للأندرويد (تحديث تلقائي)
            - **نسخة لوحة التحكم المركزية (`UniFood-Admin.apk`)**: تفتح لوحة تحكم الإدارة المركزية والطلبات والفروع مباشرة.
            - **نسخة الطلاب (`UniFood-Student.apk`)**: تفتح متجر الطلاب وسلة الشلة مباشرة.
            - **نسخة كابتن التوصيل (`UniFood-Driver.apk`)**: تفتح بوابة الطيارين مباشرة مع إبقاء الشاشة نشطة والتنبيه الصوتي.
            *(يمكن تثبيت التطبيقات الثلاثة معاً على نفس الهاتف بدون أي تعارض لأن لكل تطبيق Package Name مستقل)*
          files: |
            ./UniFood-Student.apk
            ./UniFood-Driver.apk
            ./UniFood-Admin.apk
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
