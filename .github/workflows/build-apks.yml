name: Build Android APKs (Student, Driver, Admin & Restaurant)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'app-config.json'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'رابط المنصة الافتراضي (اتركه فارغاً لقراءة الرابط من app-config.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apks:
    name: توليد نسخ APK للطلاب والطيارين والإدارة
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare App Icon & Persistent Signing Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          cp -f customer-app/public/logo.png android-app/app/src/main/res/drawable/ic_launcher.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android-app/app/src/main/res/$dir"
            cp -f customer-app/public/logo.png "android-app/app/src/main/res/$dir/ic_launcher.png"
          done

          # إنشاء شهادة التوقيع أو استرجاعها من Secret خاص بالمستودع بأمان تام دون نشر المفتاح للعامة
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/app/release.keystore
          elif [ ! -f android-app/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android-app/app/release.keystore \
              -alias unifood \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass unifood123 \
              -keypass unifood123 \
              -dname "CN=UniFood, OU=Campus, O=UniFood, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Build Signed Student, Driver, Admin & Restaurant APKs
        working-directory: android-app
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: "unifood123"
          KEY_ALIAS: "unifood"
          KEY_PASSWORD: "unifood123"
        run: |
          CONFIG_URL=$(node -e "try { console.log(require('../app-config.json').baseUrl || ''); } catch(e) { console.log(''); }")
          SERVER_URL="${INPUT_BASE_URL:-${CONFIG_URL:-https://unifood.store}}"
          echo "Building APKs with fallback BASE_URL=$SERVER_URL (Dynamic config via GitHub app-config.json enabled)"
          gradle assembleRelease -PBASE_URL="$SERVER_URL" --no-daemon

      - name: Collect Built APKs
        run: |
          STUDENT_APK=$(find android-app/app/build/outputs/apk/student/release -name "*.apk" | head -n 1)
          DRIVER_APK=$(find android-app/app/build/outputs/apk/driver/release -name "*.apk" | head -n 1)
          ADMIN_APK=$(find android-app/app/build/outputs/apk/admin/release -name "*.apk" | head -n 1)
          RESTAURANT_APK=$(find android-app/app/build/outputs/apk/restaurant/release -name "*.apk" | head -n 1)
          SMSGATEWAY_APK=$(find android-app/app/build/outputs/apk/smsGateway/release -name "*.apk" | head -n 1)
          cp "$STUDENT_APK" ./UniFood-Student.apk
          cp "$DRIVER_APK" ./UniFood-Driver.apk
          cp "$ADMIN_APK" ./UniFood-Admin.apk
          cp "$RESTAURANT_APK" ./UniFood-Restaurant.apk
          if [ -n "$SMSGATEWAY_APK" ]; then
            cp "$SMSGATEWAY_APK" ./UniFood-SmsGateway.apk
          fi
          ls -lh ./UniFood-Student.apk ./UniFood-Driver.apk ./UniFood-Admin.apk ./UniFood-Restaurant.apk ./UniFood-SmsGateway.apk || true

      - name: Upload Student APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Student-APK
          path: ./UniFood-Student.apk
          if-no-files-found: error

      - name: Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Driver-APK
          path: ./UniFood-Driver.apk
          if-no-files-found: error

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Admin-APK
          path: ./UniFood-Admin.apk
          if-no-files-found: error

      - name: Upload Restaurant APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-Restaurant-APK
          path: ./UniFood-Restaurant.apk
          if-no-files-found: error

      - name: Upload SMS Gateway APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniFood-SmsGateway-APK
          path: ./UniFood-SmsGateway.apk
          if-no-files-found: warn

      - name: Publish APKs to GitHub Releases (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "📲 تطبيقات UniFood للأندرويد (الطلاب + الطيارين + الإدارة + المطاعم + بوابة الرسائل)"
          body: |
            ### 🎓 تطبيقات منظومة يونيفود للأندرويد (تحديث تلقائي)
            - **نسخة بوابة رسائل الـ SMS المباشرة (`UniFood-SmsGateway.apk`)**: تطبيق هاتف الإدارة لإرسال رسائل التحقق (OTP) من شريحة الهاتف في الخلفية بنجاح.
            - **نسخة كاشير ومطبخ المطعم (`UniFood-Restaurant.apk`)**: تفتح شاشة الكاشير والـ POS للمطعم مباشرة، وتستقبل الطلبات فورياً مع إنذار صوتي مستمر وإبقاء الشاشة مفعلة.
            - **نسخة لوحة التحكم المركزية (`UniFood-Admin.apk`)**: تفتح لوحة تحكم الإدارة المركزية والطلبات والفروع مباشرة.
            - **نسخة الطلاب (`UniFood-Student.apk`)**: تفتح متجر الطلاب وسلة الشلة مباشرة.
            - **نسخة كابتن التوصيل (`UniFood-Driver.apk`)**: تفتح بوابة الطيارين مباشرة مع إبقاء الشاشة نشطة والتنبيه الصوتي.
          files: |
            ./UniFood-Student.apk
            ./UniFood-Driver.apk
            ./UniFood-Admin.apk
            ./UniFood-Restaurant.apk
            ./UniFood-SmsGateway.apk
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
